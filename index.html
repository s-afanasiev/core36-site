<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Закрытый материал</title>
<style>
:root { --paper: #EEF1F3; --sheet: #FAFBFC; --ink: #15202A; --ink-2: #4D5B68; --rule: #C6CFD7; --accent: #2148C8; --accent-ink: #FFFFFF; --danger: #C2362B; }
@media (prefers-color-scheme: dark) { :root { --paper: #0E1419; --sheet: #141C23; --ink: #E2E8ED; --ink-2: #9BA9B6; --rule: #2C3946; --accent: #7E9BFF; --accent-ink: #0E1419; --danger: #F0716A; color-scheme: dark; } }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--paper); color: var(--ink); font: 16px/1.5 "Segoe UI", system-ui, sans-serif; padding: 24px max(16px, env(safe-area-inset-left, 0px)); }
form { width: min(380px, 100%); background: var(--sheet); border: 2px solid var(--ink); padding: 24px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: 1.4rem; }
p { margin: 0; color: var(--ink-2); font-size: .95rem; }
label { display: grid; gap: 6px; font-size: .9rem; }
input[type=password] { font: inherit; padding: 9px 10px; border: 1px solid var(--ink); background: var(--paper); color: var(--ink); }
.remember { display: flex; gap: 8px; align-items: center; color: var(--ink-2); }
button { font: inherit; font-weight: 600; padding: 10px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer; }
button:disabled { opacity: .6; cursor: progress; }
.error { color: var(--danger); min-height: 1.5em; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<form id="gate">
  <h1>Закрытый материал</h1>
  <p>Пароль передан отдельно.</p>
  <label>Пароль<input id="pass" type="password" autocomplete="current-password" required autofocus></label>
  <label class="remember"><input id="remember" type="checkbox"> Запомнить на этом устройстве</label>
  <button id="open" type="submit">Открыть</button>
  <p class="error" id="error" role="alert"></p>
</form>

  var STORE = "gate:key:" + BOX.salt;
  function bytes(b64) { return Uint8Array.from(atob(b64), function (c) { return c.charCodeAt(0); }); }
  function b64(buf) { return btoa(String.fromCharCode.apply(null, new Uint8Array(buf))); }
  function show(html) { document.open(); document.write(html); document.close(); }
  async function decrypt(key) {
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(BOX.iv) }, key, bytes(BOX.data));
    return new TextDecoder().decode(plain);
  }
  async function keyFrom(pass) {
    var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
    return crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: bytes(BOX.salt), iterations: BOX.iterations },
      base, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
  }
  var saved = null;
  try { saved = localStorage.getItem(STORE); } catch (e) { /* хранилище может быть недоступно */ }
  if (saved) {
    crypto.subtle.importKey("raw", bytes(saved), "AES-GCM", false, ["decrypt"])
      .then(decrypt).then(show)
      .catch(function () { try { localStorage.removeItem(STORE); } catch (e) { /* ничего */ } });
  }
  var form = document.getElementById("gate"), btn = document.getElementById("open"), err = document.getElementById("error");
  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    err.textContent = "";
    btn.disabled = true;
    btn.textContent = "Открываю…";
    try {
      var key = await keyFrom(document.getElementById("pass").value);
      var html = await decrypt(key);
      if (document.getElementById("remember").checked) {
        try { localStorage.setItem(STORE, b64(await crypto.subtle.exportKey("raw", key))); } catch (x) { /* не запомним — не страшно */ }
      }
      show(html);
    } catch (x) {
      err.textContent = "Пароль не подошёл. Проверьте раскладку и регистр.";
      btn.disabled = false;
      btn.textContent = "Открыть";
    }
